<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel de leads — Asesor Mejoravit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background-color: var(--gris-claro); }
    .panel { max-width: 1000px; padding: 32px 16px 64px; }
    .panel-card {
      background-color: var(--blanco);
      border-radius: 14px;
      border-top: 4px solid var(--rojo);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      padding: 24px;
    }
    .login-card { max-width: 420px; margin: 40px auto 0; }
    .tabla-leads th { font-size: .8rem; text-transform: uppercase; color: var(--gris-medio); font-weight: 600; }
    .tabla-leads td { vertical-align: middle; }
    .lead-viejo td { background-color: #fff8e1; }
    .lead-nuevo td { background-color: #d4edda; transition: background-color 1s ease; }
    .btn-rojo { background-color: var(--rojo); color: #fff; border: none; }
    .btn-rojo:hover, .btn-rojo:focus { background-color: var(--rojo-oscuro); color: #fff; }
  </style>
</head>
<body>

  <nav class="navbar navbar-light bg-white" aria-label="Navegación del panel">
    <div class="container">
      <span class="navbar-brand fw-bold fs-5"><span>Mejoravit</span> Panel</span>
      <button type="button" id="btn-salir" class="btn btn-sm btn-outline-secondary rounded-pill px-3 d-none">Salir</button>
    </div>
  </nav>

  <main class="container panel">

    <!-- Acceso con la clave ADMIN_TOKEN -->
    <section id="vista-login" class="panel-card login-card" aria-labelledby="login-titulo">
      <h1 id="login-titulo" class="fs-4 fw-bold mb-3">Entrar al panel</h1>
      <form id="form-login">
        <label for="token" class="form-label fw-semibold">Clave de administrador</label>
        <input type="password" id="token" class="form-control mb-3" autocomplete="current-password" required />
        <button type="submit" class="btn btn-rojo w-100 rounded-pill fw-semibold">Entrar</button>
        <p id="login-error" class="text-danger small mt-3 mb-0" role="alert"></p>
      </form>
    </section>

    <!-- Lista de leads -->
    <section id="vista-leads" class="d-none" aria-labelledby="leads-titulo">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <div>
          <h1 id="leads-titulo" class="fs-4 fw-bold mb-0">Leads <span id="total" class="text-muted fw-normal fs-6"></span></h1>
          <p class="small text-muted mb-0">Se actualiza solo cada 15 segundos · <span id="ultima-revision"></span></p>
        </div>
        <div class="d-flex gap-2">
          <button type="button" id="btn-avisos" class="btn btn-sm btn-outline-secondary text-nowrap d-none">Activar avisos</button>
          <input type="search" id="buscar" class="form-control form-control-sm" placeholder="Buscar nombre o teléfono" aria-label="Buscar" />
          <button type="button" id="btn-actualizar" class="btn btn-sm btn-outline-secondary">Actualizar</button>
        </div>
      </div>

      <div class="panel-card">
        <p id="aviso-viejos" class="small mb-3 d-none">
          Los registros resaltados tienen más de 6 meses. Según tu aviso de privacidad, bórralos
          si esa persona no siguió con el trámite.
        </p>
        <div class="table-responsive">
          <table class="table tabla-leads mb-0">
            <thead>
              <tr>
                <th scope="col">Fecha</th>
                <th scope="col">Nombre</th>
                <th scope="col">Teléfono</th>
                <th scope="col" class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-cuerpo"></tbody>
          </table>
        </div>
        <p id="sin-leads" class="text-muted text-center my-4 d-none">Todavía no hay leads registrados.</p>
        <p id="error-leads" class="text-danger my-3 d-none" role="alert"></p>
      </div>
    </section>

  </main>

  <script src="js/admin.js"></script>
</body>
</html>
